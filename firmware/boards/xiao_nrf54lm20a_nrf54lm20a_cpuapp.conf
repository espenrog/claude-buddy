# Settings for the Seeed XIAO nRF54LM20A (battery powered). The pins of what you connect to it are in the overlay next to this file.

# No cell temperature: the power chip's NTC pin has a fixed 10 k resistor, not the cell's thermistor.
CONFIG_BUDDY_CELL_THERMISTOR=n

# The accelerometer (motion.c sets its registers itself: Zephyr's LSM6DSL driver has no tap or free-fall interrupts).
CONFIG_LSM6DSL=n
# The accelerometer's supply is the power chip's LDO1 (see the overlay).
CONFIG_REGULATOR=y
