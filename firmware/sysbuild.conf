# Seeed XIAO nRF54LM20A: MCUboot with two image slots in the on-chip memory (swap using move). The application takes
# the new image over Bluetooth itself (BUDDY_SMP_UPDATE). Sysbuild reads this file by itself.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_MOVE=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_ED25519=y
# The public key is built into MCUboot, not stored in the chip's key store: the XIAO's USB-C probe (CMSIS-DAP) cannot
# run the key provisioning that nrfutil does over a J-Link.
SB_CONFIG_MCUBOOT_SIGNATURE_USING_KMU=n
