CONFIG_NCS_SAMPLES_DEFAULTS=y

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Claude Buddy"
# The name gets the last two bytes of the device address appended at boot (see ble_svc.c), so buddies in range differ.
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=24
# Pairing (BUDDY_REQUIRE_PAIRING): up to three bridges (e.g. home, office, a spare); the oldest pairing is replaced
CONFIG_BT_MAX_PAIRED=3
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y

CONFIG_LOG=y

CONFIG_DK_LIBRARY=y

CONFIG_DISPLAY=y
CONFIG_I2C=y
CONFIG_PWM=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Accept prepared (long/reliable) writes from centrals such as nRF Connect.
CONFIG_BT_ATT_PREPARE_COUNT=4

# Settings saved across power cycles (stored in the on-chip non-volatile memory)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y
